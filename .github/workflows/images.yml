name: Test and publish images
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: "26", cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - run: npm ci && npm run guard && npm run check && npm test
      - run: npx playwright install --with-deps chromium
      - name: Install disposable Keycloak
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/kc.tgz" https://github.com/keycloak/keycloak/releases/download/26.4.7/keycloak-26.4.7.tar.gz
          printf '%s  %s\n' aca60ab72ae4d67adc6b8fe7fca5e08d16a6bb5e4a4f2ebb54050e3f5503fd2b "$RUNNER_TEMP/kc.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/kc.tgz" -C "$RUNNER_TEMP"
          printf 'KC_HOME=%s/keycloak-26.4.7\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Determine changed image inputs
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          images='harness sandbox sandbox-controller'
          if [ -n "$BASE" ]; then
            git fetch --no-tags --depth=1 origin "$BASE"
            git diff --name-only "$BASE" HEAD > "$RUNNER_TEMP/paths"
            images=''
            for name in harness sandbox sandbox-controller; do
              pattern="^($name/|\.github/|\.dockerignore)"
              if [ "$name" = harness ]; then pattern="$pattern|^(contract/|web/|package(-lock)?\.json|tsconfig)"; fi
              if grep -Eq "$pattern" "$RUNNER_TEMP/paths"; then images="$images $name"; fi
            done
          fi
          printf 'IMAGES=%s\n' "$images" >> "$GITHUB_ENV"
      - name: Build native candidates
        run: |
          for image in $IMAGES; do
            docker build --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "pi-cloud-$image:test" -f "$image/Dockerfile" .
          done
      - name: Run browser acceptance
        run: |
          if docker image inspect pi-cloud-harness:test >/dev/null 2>&1; then export HARNESS_IMAGE=pi-cloud-harness:test; fi
          if docker image inspect pi-cloud-sandbox:test >/dev/null 2>&1; then export WORKER_IMAGE=pi-cloud-sandbox:test; fi
          npm run e2e
      - name: Verify controller image modules
        run: |
          if docker image inspect pi-cloud-sandbox-controller:test >/dev/null 2>&1; then docker run --rm pi-cloud-sandbox-controller:test node --input-type=module -e "await import('./lifecycle.mjs')"; fi
      - name: Save tested images
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: docker save $(for name in $IMAGES; do printf 'pi-cloud-%s:test ' "$name"; done) | gzip -1 > "$RUNNER_TEMP/images.tar.gz"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          {
            name: native-images,
            path: "${{ runner.temp }}/images.tar.gz",
            retention-days: 1,
            compression-level: 0,
          }
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04-arm
    permissions: { packages: write, contents: read }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: native-images }
      - run: docker load -i images.tar.gz
      - name: Publish tested images by revision
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for name in harness sandbox sandbox-controller; do
            ref="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pi-cloud-$name:$GITHUB_SHA"
            docker tag "pi-cloud-$name:test" "$ref"
            docker push "$ref"
            docker inspect --format '{{join .RepoDigests "\n"}}' "$ref" >> "$GITHUB_STEP_SUMMARY"
          done
